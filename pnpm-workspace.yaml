packages:
  - .

# pnpm >= 10 需要放行 esbuild 的 postinstall 才能安装。
allowBuilds:
  esbuild: true

# 把传递依赖 @deepseek-ai/dsh-invariants 固定到 0.1.1-rc.2：
# 已发布的 dsh-client-*@0.1.0-rc.8 依赖范围 `^0.1.0-rc.8`，否则 pnpm 会爬到
# dsh-api-remotes 上那些 `^0.1.1` 范围排除所有预发布版本的组合。
# 与你开发所用的 dsh web profile 保持同步。
overrides:
  '@deepseek-ai/dsh-invariants': 0.1.1-rc.2
